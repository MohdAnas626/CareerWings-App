<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CareerWings</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
        }
        nav {
            background: #0077b6;
            padding: 1em;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover { 
            text-decoration: underline; 
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        h2 { 
            text-align: center; 
            color: #0077b6; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
        }
        button {
            background: #0077b6;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { 
            background: #005f87; 
        }
        .error { 
            color: red; 
            text-align: center; 
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/signin">Sign In</a>
        <a href="/signup">Sign Up</a>
        <a href="/admin_login">Admin</a>
    </nav>
    <div class="container">
        <h2>Sign Up</h2>
        <form method="POST" action="/signup">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="education" placeholder="Education" required>
            <input type="text" name="skills" placeholder="Skills (comma-separated)" required>
            <input type="text" name="interests" placeholder="Interests (comma-separated)">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
